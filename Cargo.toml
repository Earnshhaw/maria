[package]
name = "maria"
version = "0.1.0"
edition = "2024"

[dependencies]
acf-parser = "0.1.0"
dashmap = { version = "6.2.1", features = ["rayon"] }
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["image", "tokio"] }
iced_aw = { version = "0.14.1", features = ["menu"] }
iced_runtime = "0.14.0"
rand = "0.10.3"
rayon = "1.12.0"
reqwest = "0.13.5"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
steamgriddb_api = "0.3.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = {version = "1.1.6", features = ["serde"]}
uuid = { version = "1.27.0", features = ["v4", "serde"] }
